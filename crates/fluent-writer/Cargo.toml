[package]
name = "fluent-writer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fluent-writer"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/SunkenInTime/rune", features = ["native-file-dialog"], rev = "5e610df7c84570d37f9906f926a57d48ecb92a4a" }
writer-core = { path = "../writer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ureq = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
notify = "8"

[dev-dependencies]
tempfile = "3"
