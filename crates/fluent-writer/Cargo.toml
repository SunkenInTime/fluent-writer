[package]
name = "fluent-writer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fluent-writer"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/SunkenInTime/rune", rev = "5e610df7c84570d37f9906f926a57d48ecb92a4a", features = ["native-file-dialog"] }
writer-core = { path = "../writer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
